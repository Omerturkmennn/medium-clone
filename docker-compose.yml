version: '3.8'

services:
  # Sadece FastAPI Servisi (Docker'da çalışacak, Windows'taki local DB'ye bağlanacak)
  api:
    build: .
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env  # Ayarları artık senin doğru yazdığın .env dosyasından çekecek!
    volumes:
      - ./uploads:/app/uploads