version: '3.8'

services:
  # 1. VERİTABANI SERVİSİ
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Mikroislemci52.
      POSTGRES_DB: medium_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. FASTAPI (BACKEND) SERVİSİ
  api:
    build: .
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      # DİKKAT: localhost yerine 'db' yazdık! Docker konteynerleri birbirini bu isimle tanır.
      - DATABASE_URL=postgresql+psycopg2://postgres:Mikroislemci52.@db:5432/medium_db
      - SECRET_KEY=09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30

volumes:
  postgres_data: